apiVersion: v1
kind: Pod
metadata:
  name: bench-policy-pod-${index}
  namespace: ${namespace}
  labels:
    security.rancher.io/policy: bench-policy-${index}
spec:
  nodeName: ${node}
  containers:
  - name: bench
    image: busybox:latest
    command: ["sleep", "3000"]
    resources:
      limits:
        cpu: 10m
        memory: 32Mi
      requests:
        cpu: 10m
        memory: 32Mi
