{{- if .Values.controller.defaultPolicy.enabled }}
apiVersion: runtimeenforcer.kubewarden.io/v1alpha1
kind: WorkloadPolicy
metadata:
  name: {{ include "runtime-enforcer.controller.defaultPolicyName" . }}
  labels:
    {{- include "runtime-enforcer.labels" . | nindent 4 }}
spec:
  mode: monitor
  rulesByContainer:
    manager:
      executables:
        allowed:
          - /controller
{{- end }}
